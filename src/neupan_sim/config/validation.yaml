# Every profile runs the SAME four worlds, in isolated ROS namespaces and TF trees.
robots:
  square:
    planner: package://neupan_ros/config/sentry_diff.yaml
    checkpoint: package://neupan_ros/models/diff_sentry.bin
  scout:
    planner: package://neupan_ros/config/scout_mini_diff.yaml
    checkpoint: package://neupan_ros/models/diff_scout_mini_612x580.bin
  trapezoid:
    planner: package://neupan_ros/config/polygon_diff.yaml
    checkpoint: package://neupan_ros/models/diff_polygon.bin

planner_overrides:
  ref_speed: 0.6
  robot:
    max_speed: [1.0, 1.0]
    max_acce: [1.0, 2.0]
  ipath:
    arrive_threshold: 0.1
    arrive_index_threshold: 1

simulator:
  physics_rate: 100.0
  sensor_rate: 20.0
  diagnostics_rate: 10.0
  initial_pose: [0.0, 0.0, 0.0]
  path_waypoints: [0.0, 0.0, 6.0, 0.0]
  world_bounds: [-3.0, 9.0, -5.0, 5.0]
  simulation_timeout: 35.0
  goal_tolerance: 0.15
  laser_pose: [0.0, 0.0, 0.0]
  scan_range_max: 8.0

scenarios:
  open:
    simulator: {}
  static:
    simulator:
      static_circles: [3.0, 0.0, 0.3]
  corridor:
    simulator:
      segments: [-1.0, -1.4, 7.0, -1.4, -1.0, 1.4, 7.0, 1.4]
  crossing:
    simulator:
      dynamic_circles: [3.0, -3.0, 0.3, 0.0, 0.6]
