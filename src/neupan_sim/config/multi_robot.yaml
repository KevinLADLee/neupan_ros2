# Dense shared scene: 10 x 7 m; 11 static circles, 5 wall segments, 3 moving circles.
# Alpha follows slalom waypoints; beta crosses the 1.55 m central wall opening.
# Moving routes pass through wall gaps and stay clear of stationary goal footprints.
robots:
  square:
    planner: package://neupan_ros/config/sentry_diff.yaml
    checkpoint: package://neupan_ros/models/diff_sentry.bin
  scout:
    planner: package://neupan_ros/config/scout_mini_diff.yaml
    checkpoint: package://neupan_ros/models/diff_scout_mini_612x580.bin
  trapezoid:
    planner: package://neupan_ros/config/compact_polygon_diff.yaml
    checkpoint: package://neupan_ros/models/diff_compact_polygon.bin
planner_overrides:
  ref_speed: 0.6
  robot:
