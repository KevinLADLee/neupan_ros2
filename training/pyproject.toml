[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neupan-training"
version = "0.1.0"
description = "Offline DUNE training and model export for neupan_core"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
  "colorama",
  "cvxpy",
  "ecos",
  "numpy",
  "rich",
  "torch>=2.1",
]

[project.scripts]
neupan-train = "neupan_training.cli:main"
neupan-export = "neupan_training.export:main"

[tool.uv]
package = true
required-version = ">=0.5.0"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]
