[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neupan-training"
version = "0.1.0"
description = "Offline DUNE training and model export for neupan_core"
requires-python = ">=3.10"
dependencies = [
  "colorama",
  "cvxpy",
  "ecos",
  "numpy",
  "rich",
  "torch>=2.1",
]

[project.scripts]
neupan-train = "neupan_training.cli:main"
neupan-export = "neupan_training.export:main"

[tool.setuptools.packages.find]
where = ["src"]
