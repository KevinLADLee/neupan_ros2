name: native ROS 2 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  training:
    name: offline training and model export
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.16'
      - name: Install CPU test environment
        run: uv sync --project training --locked --no-default-groups --group cpu
      - name: Build model verification tool
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
          g++ -std=c++17 -O2 -I/usr/include/eigen3 -Isrc/neupan_core/include \
            src/neupan_core/tools/verify_model.cpp src/neupan_core/src/mlp.cpp \
            src/neupan_core/src/tensor_io.cpp -o /tmp/neupan_verify_model
      - name: Training, resume and Python/C++ export regression tests
        env:
          NEUPAN_VERIFY_MODEL: /tmp/neupan_verify_model
        run: uv run --project training --locked --no-default-groups --group cpu python -m unittest discover -s training/tests -v

  build:
    name: build and test (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            container: ros:humble-ros-base-jammy
          - ros_distro: jazzy
            container: ros:jazzy-ros-base-noble
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git libeigen3-dev \
            libgtest-dev libyaml-cpp-dev python3-colcon-common-extensions \
            python3-tomli

      - name: Verify package boundary
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          test "$(colcon list --names-only | sort | tr '\n' ' ')" = \
            "neupan_core neupan_ros neupan_sim neupan_solver_vendor "

      - name: Build and test native workspace
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ./build.sh --test
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Validate offline training package
        run: |
          python3 -m compileall -q training/src
          python3 -c "import pathlib, tomli; tomli.loads(pathlib.Path('training/pyproject.toml').read_text())"
