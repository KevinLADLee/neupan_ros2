name: native ROS 2 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git libeigen3-dev \
            libgtest-dev libyaml-cpp-dev python3-colcon-common-extensions

      - name: Verify package boundary
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          test "$(colcon list --names-only | sort | tr '\n' ' ')" = \
            "neupan_core neupan_ros neupan_sim "

      - name: Build and test native workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ./build.sh test
          colcon test --packages-select neupan_core
          colcon test-result --verbose

      - name: Validate offline training package
        run: |
          python3 -m compileall -q training/src
          python3 -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('training/pyproject.toml').read_text())"
